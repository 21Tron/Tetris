if(G.state==='count'){const f=G.cd%1;c.globalAlpha=Math.min(1,f*2+.15);c.fillStyle='#fff';c.shadowColor=`hsl(${G.hue} 90% 60%)`;c.shadowBlur=S;c.font=`800 ${S*4.5*(1.25-f*.25)}px ${FONT}`;c.fillText(Math.ceil(G.cd),W*S/2,H*S/2);c.shadowBlur=0;c.globalAlpha=1}
c.restore()}
const BG=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),s:12+Math.random()*26,v:.02+Math.random()*.05,r:Math.random()*6,w:(Math.random()-.5)*.6}));
function bgd(dt){const c=bgc,w=bg.width,h=bg.height;c.clearRect(0,0,w,h);BG.forEach((b,i)=>{b.y+=b.v*dt;b.r+=b.w*dt;if(b.y>1.1)b.y=-.1;c.save();c.translate(b.x*w,b.y*h);c.rotate(b.r);c.globalAlpha=.15;c.fillStyle=`hsl(${(G.hue+i*23)%360} 85% 62%)`;c.fillRect(-b.s/2,-b.s/2,b.s,b.s);c.restore()})}

/* ---------- Hauptschleife ---------- */
function tick(dt){const s=G.state;
if(s!=='pause'){PT.forEach(q=>{q.vy+=22*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*1.5});PT=PT.filter(q=>q.l>0);POP.forEach(q=>q.l-=dt*.7);POP=POP.filter(q=>q.l>0)}
if(s==='count'){G.cd-=dt;if(G.cd<=0){G.p?G.state='play':next()}}
else if(s==='clear'){G.clr.t+=dt;if(G.clr.t>=.42)done()}
else if(s==='play'){for(const a in REP){const r=a==='down'?.045:ARR;REP[a]+=dt;while(REP[a]>=r){REP[a]-=r;ACT[a]()}}
 const p=G.p,iv=Math.max(.004,Math.pow(.8-(G.level-1)*.007,G.level-1)),sd=G.soft?Math.min(iv,.045):iv;G.acc+=dt;
 while(G.acc>=sd){G.acc-=sd;if(hit(p.m,p.x,p.y+1)){G.acc=0;break}p.y++;if(G.soft){G.score++;G.dirty=1}G.rot=false;if(p.y>G.low){G.low=p.y;G.rs=0;G.lock=0}}
 if(hit(p.m,p.x,p.y+1)){G.lock+=dt;if(G.lock>=.5)lock()}else G.lock=0}
if(G.dirty){hud();G.dirty=0}}
requestAnimationFrame(function f(t){requestAnimationFrame(f);const dt=Math.min(.05,(t-f.l)/1000||0);f.l=t;tick(dt);render(dt);bgd(dt)});
applyLang();fit();theme();hud();show('menu');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
